name: Build VeriDoc Android App (APK & AAB for Play Store)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build Universal Release APK (for Direct Testing & Sideloading)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: veridoc-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: veridoc-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

