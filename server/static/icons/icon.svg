  <!-- Inner Protective Shield -->
  <path d="M 256 94 L 386 146 L 386 264 C 386 345 328 406 256 424 C 184 406 126 345 126 264 L 126 146 Z" 
        fill="#143628" opacity="0.9" filter="url(#shadow)" />

  <!-- Central Verification Checkmark -->
  <path d="M 195 260 L 238 304 L 325 212" 
