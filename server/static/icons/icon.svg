<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2318" />
      <stop offset="35%" stop-color="#143628" />
      <stop offset="70%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#06160e" />
    </linearGradient>

    <!-- Glass Specular Reflection Highlight -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#52b788" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Metallic Gold & Emerald Rim -->
    <linearGradient id="goldEmeraldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="25%" stop-color="#52b788" />
      <stop offset="50%" stop-color="#d8f3dc" />
      <stop offset="75%" stop-color="#e9c46a" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>

    <!-- Shield 3D Left Facet (Light Source) -->
    <linearGradient id="shieldLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c" />
      <stop offset="50%" stop-color="#2d6a4f" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>

    <!-- Shield 3D Right Facet (Deep Shadow) -->
    <linearGradient id="shieldRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4e38" />
      <stop offset="50%" stop-color="#143628" />
      <stop offset="100%" stop-color="#0b2318" />
    </linearGradient>

    <!-- Verification Checkmark Glowing Neon Gradient -->
    <linearGradient id="checkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#bbf7d0" />
      <stop offset="65%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Dimensional 3D Elements -->
    <filter id="deepShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. BASE SQUIRCLE WITH LUXURY GRADIENT -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bgGrad)" />

  <!-- 2. ULTRA-FINE METALLIC BEVEL BORDER -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldEmeraldRim)" stroke-width="4.5" opacity="0.9" />

  <!-- 3. INNER AMBIENT RADIANCE GLOW -->
  <circle cx="256" cy="240" r="170" fill="#52b788" opacity="0.12" filter="url(#emeraldGlow)" />

  <!-- 4. SUBTLE CRYPTOGRAPHIC CIRCUIT GRID -->
  <g opacity="0.18">
    <circle cx="256" cy="250" r="195" fill="none" stroke="#74c69d" stroke-width="1.5" stroke-dasharray="6, 8" />
    <circle cx="256" cy="250" r="165" fill="none" stroke="#52b788" stroke-width="1.2" stroke-dasharray="14, 10" />
    <circle cx="256" cy="250" r="135" fill="none" stroke="#d8f3dc" stroke-width="1" stroke-dasharray="4, 12" />
    <!-- Crosshairs -->
    <line x1="256" y1="45" x2="256" y2="75" stroke="#e9c46a" stroke-width="3" stroke-linecap="round" />
    <line x1="256" y1="425" x2="256" y2="455" stroke="#e9c46a" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="250" x2="75" y2="250" stroke="#e9c46a" stroke-width="3" stroke-linecap="round" />
    <line x1="425" y1="250" x2="455" y2="250" stroke="#e9c46a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 5. 3D MULTI-FACETED SECURITY SHIELD (WITH DEEP SHADOW) -->
  <g filter="url(#deepShadow)">
    <!-- Outer Shield Crest Gold Trim -->
    <path d="M 256 68 
             C 335 98, 385 108, 420 128 
             C 420 255, 365 372, 256 438 
             C 147 372, 92 255, 92 128 
             C 127 108, 177 98, 256 68 Z" 
          fill="none" stroke="url(#goldEmeraldRim)" stroke-width="6" stroke-linejoin="round" />

    <!-- Left Shield Facet (Illuminated 3D Half) -->
    <path d="M 256 76 
             C 182 104, 134 114, 102 133 
             C 102 248, 153 355, 256 422 
             L 256 76 Z" 
          fill="url(#shieldLeftFacet)" />

    <!-- Right Shield Facet (Deep Chiseled Shadow Half) -->
    <path d="M 256 76 
             C 330 104, 378 114, 410 133 
             C 410 248, 359 355, 256 422 
             L 256 76 Z" 
          fill="url(#shieldRightFacet)" />

    <!-- Center Spine Highlight -->
    <line x1="256" y1="76" x2="256" y2="422" stroke="#74c69d" stroke-width="2.5" opacity="0.65" />
  </g>

  <!-- 6. THE EMBEDDED DYNAMIC "V" OF VERIDOC -->
  <path d="M 160 162 L 256 348 L 352 162" 
        fill="none" stroke="#102e21" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

  <!-- 7. RADIANT NEON VERIFICATION CHECKMARK (MAIN ICONIC HERO) -->
  <g filter="url(#softShadow)">
    <path d="M 182 252 L 236 308 L 338 186" 
          fill="none" stroke="url(#checkGlow)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Ultra-Crisp Center Specular Core Line -->
    <path d="M 182 252 L 236 308 L 338 186" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- 8. CORONA ORBITAL CONSTELLATION NODES (ASHOKA CHAKRA 12 NODES) -->
  <g fill="#74c69d">
    <circle cx="256" cy="108" r="5" />
    <circle cx="318" cy="124" r="4.5" />
    <circle cx="366" cy="168" r="4.5" />
    <circle cx="384" cy="228" r="4.5" />
    <circle cx="372" cy="292" r="4.5" />
    <circle cx="328" cy="350" r="4.5" />
    <circle cx="256" cy="392" r="5.5" fill="#f4a261" />
    <circle cx="184" cy="350" r="4.5" />
    <circle cx="140" cy="292" r="4.5" />
    <circle cx="128" cy="228" r="4.5" />
    <circle cx="146" cy="168" r="4.5" />
    <circle cx="194" cy="124" r="4.5" />
  </g>

  <!-- 9. LUXURY DIAGONAL GLASS SHEEN ACROSS SQUIRCLE -->
  <path d="M 12 128 
           C 12 64, 64 12, 128 12 
           L 440 12 
           C 470 12, 492 30, 498 56 
           L 12 360 Z" 
        fill="url(#glassSheen)" pointer-events="none" />

  <!-- 10. SOVEREIGN REGULATORY GOLD EMBLEM STAR AT TOP -->
  <polygon points="256,42 262,56 276,57 265,66 268,80 256,72 244,80 247,66 236,57 250,56" 
           fill="#f4a261" stroke="#e9c46a" stroke-width="1.5" />
</svg>
