    // ---------------- THREE.JS 3D HOLOGRAPHIC SEAL COMPONENT ----------------
    function ThreeDHologramShield() {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.THREE) return;
        const container = containerRef.current;
        const width = container.clientWidth || 220;
        const height = container.clientHeight || 140;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Outer Hexagonal Security Ring
        const geometry = new THREE.IcosahedronGeometry(1.6, 1);
        const material = new THREE.MeshBasicMaterial({
          color: 0x2d6a4f,
          wireframe: true,
          transparent: true,
          opacity: 0.75
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Inner Glowing Core (Cryptographic Seed)
        const innerGeo = new THREE.OctahedronGeometry(0.9, 0);
        const innerMat = new THREE.MeshBasicMaterial({
          color: 0x1b4332,
          wireframe: false,
          transparent: true,
          opacity: 0.9
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerMesh);

        // Particle Points
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 120;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i < particleCount * 3; i++) {
          posArray[i] = (Math.random() - 0.5) * 4.5;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
          size: 0.04,
          color: 0x52b788,
          transparent: true,
          opacity: 0.8
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          sphere.rotation.x += 0.005;
          sphere.rotation.y += 0.01;
          innerMesh.rotation.x -= 0.01;
          innerMesh.rotation.y -= 0.008;
          particles.rotation.y += 0.002;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          if (container && renderer.domElement) {
            container.innerHTML = '';
          }
        };
      }, []);

      return (
        <div className="relative flex flex-col items-center justify-center p-2 rounded-2xl bg-gradient-to-b from-forest-50/80 to-white border border-forest-200 shadow-inner">
          <div ref={containerRef} className="w-full h-28" />
          <div className="text-center mt-1">
            <span className="text-[9px] font-mono font-bold tracking-widest uppercase bg-forest-100 text-forest-800 px-2 py-0.5 rounded-full">
              3D Quantum Shield Active
            </span>
          </div>
        </div>
      );
    }

                            <span className="text-gray-800 font-semibold">{blockchainData.validator_node}</span>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* ---------------- 10. COMPLIANCE RULES TAB ---------------- */}
              {activeTab === 'rules' && (
                <div className="space-y-6 max-w-4xl mx-auto">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <div>
                      <h2 className="text-lg font-bold text-forest-600">Statutory Compliance Rules Engine</h2>
                      <p className="text-xs text-gray-400">
                        National Approval Process Handbook (APH 2026-27) Statutory Clauses and Automated Verification Checkpoints
                      </p>
                    </div>
                    <button
                      onClick={handleRunComplianceAudit}
                      className="px-3.5 py-2 bg-forest-600 hover:bg-forest-700 text-white font-bold rounded-xl text-xs transition shadow-sm"
                    >
                      Audit Missing Mandatory Fields
                    </button>
                  </div>

                  {complianceAudit && (
                    <div className="p-5 bg-amber-50/60 border border-amber-200 rounded-2xl space-y-3 text-xs animate-fadeIn">
                      <div className="flex justify-between items-center">
                        <h4 className="font-bold text-amber-900">AI Compliance Readiness: {complianceAudit.overall_compliance_readiness}</h4>
                        <span className="text-xs text-gray-500">{complianceAudit.regulation_evaluated}</span>
                      </div>
                      <div className="space-y-1">
                        <p className="font-bold text-gray-700">Missing Mandatory Field Checks:</p>
                        {complianceAudit.mandatory_field_checks.map((f, i) => (
                          <div key={i} className="flex justify-between p-2 bg-white rounded-lg border border-gray-200">
                            <span>{f.field}</span>
                            <span className={`font-bold text-[10px] px-2 py-0.5 rounded ${
                              f.status === 'COMPLIANT' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                            }`}>
                              {f.status}
                            </span>
                          </div>
                        ))}
                      </div>
                      <div className="pt-2 border-t border-amber-200">
                        <p className="font-bold text-red-900">Recommended Corrective Actions:</p>
                        <ul className="list-disc pl-5 space-y-1 text-gray-700 mt-1">
                          {complianceAudit.recommended_actions.map((act, idx) => (
                            <li key={idx}>{act}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 gap-4">
                    {complianceRules.map((r, i) => (
                      <div key={i} className="border border-gray-200 rounded-2xl p-5 bg-white shadow-sm hover:border-forest-600 transition flex items-start justify-between">
                        <div className="space-y-1">
                          <div className="flex items-center space-x-2">
                            <span className="font-mono font-bold text-xs bg-forest-100 text-forest-800 px-2 py-0.5 rounded">
                              {r.clause}
                            </span>
                            <span className="font-bold text-sm text-gray-900">{r.title}</span>
                            <span className="bg-red-50 text-red-700 text-[10px] font-bold px-2 py-0.2 rounded">
                              {r.status}
                            </span>
                          </div>
                          <p className="text-xs text-gray-600">{r.description}</p>
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] text-gray-400 uppercase font-bold block">Evaluation Weight</span>
                          <span className="text-sm font-black text-forest-600">{r.weight}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* ---------------- 11. NEW APPLICATION TAB ---------------- */}
              {activeTab === 'new-application' && (
                <div className="max-w-xl mx-auto border border-gray-200 rounded-2xl p-8 bg-white shadow-sm">
                  <h2 className="text-xl font-bold text-forest-600 mb-1">Submit New Regulatory Application</h2>
                  <p className="text-xs text-gray-400 mb-6">Register an application into the AI automated verification workflow</p>

                  {appMsg && (
                    <div className="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl font-bold">
                      {appMsg}
                    </div>
                  )}

                  <form onSubmit={handleCreateApp} className="space-y-4">
                    <div>
                      <label className="block text-[11px] font-bold text-forest-600 uppercase mb-1">Applicant / Institution Name</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Apex Institute of Science & Technology"
                        className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-forest-600 focus:outline-none"
                        value={appName}
                        onChange={(e) => setAppName(e.target.value)}
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-forest-600 uppercase mb-1">Application Classification</label>
                      <select
                        value={appClassification}
                        onChange={(e) => setAppClassification(e.target.value)}
                        className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-xs bg-white focus:ring-2 focus:ring-forest-600 focus:outline-none"
                      >
                        <option>Affiliation Filing</option>
                        <option>Land Registry & Infrastructure</option>
                        <option>Regulatory APH Compliance Filing</option>
                        <option>Accreditation & Faculty Credentials</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-forest-600 uppercase mb-1">Application Notes / Stipulations</label>
                      <textarea
                        rows="3"
                        placeholder="Remarks for verification committee..."
                        className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-forest-600 focus:outline-none"
                        value={appNotes}
                        onChange={(e) => setAppNotes(e.target.value)}
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white font-bold rounded-xl shadow-md text-xs uppercase tracking-wider transition"
                    >
                      Submit Application for Verification
                    </button>
                  </form>
                </div>
              )}
            </main>
          </div>

          {/* ---------------- FLOATING AI REGULATORY COPILOT CHATBOT ---------------- */}
          <div className="fixed bottom-6 right-6 z-50">
            {!chatOpen ? (
              <button
                onClick={() => setChatOpen(true)}
                className="p-3.5 bg-forest-600 hover:bg-forest-700 text-white rounded-full shadow-2xl flex items-center space-x-2 transition transform hover:scale-105"
                title="Open AI Regulatory Copilot"
              >
                <Icons.Chat />
                <span className="text-xs font-bold pr-1 hidden sm:inline">AI Regulatory Assistant</span>
              </button>
            ) : (
              <div className="w-80 sm:w-96 bg-white border border-gray-200 rounded-3xl shadow-2xl flex flex-col h-96 overflow-hidden">
                {/* Chat Header */}
                <div className="bg-forest-600 text-white p-3.5 flex justify-between items-center">
                  <div className="flex items-center space-x-2">
                    <Icons.Chat />
                    <div>
                      <h4 className="text-xs font-bold leading-tight">AI Regulatory Copilot</h4>
                      <p className="text-[10px] text-forest-200">APH 2026-27 Knowledge Engine</p>
                    </div>
                  </div>
                  <button onClick={() => setChatOpen(false)} className="text-white hover:text-gray-200 font-bold text-lg">×</button>
                </div>

                {/* Messages Body */}
                <div className="flex-1 p-3 overflow-y-auto space-y-2.5 custom-scroll text-xs">
                  {chatMessages.map((msg, i) => (
                    <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`p-2.5 rounded-2xl max-w-[85%] whitespace-pre-line ${
                        msg.sender === 'user' ? 'bg-forest-600 text-white rounded-br-xs' : 'bg-gray-100 text-gray-800 rounded-bl-xs'
                      }`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                  {chatLoading && (
                    <div className="flex justify-start">
                      <div className="p-2.5 bg-gray-100 rounded-2xl text-[11px] text-gray-500 animate-pulse">
                        Evaluating statutory clauses...
                      </div>
                    </div>
                  )}
                </div>

                {/* Chat Input */}
                <form onSubmit={handleSendChat} className="p-2 border-t border-gray-100 flex gap-2 bg-gray-50">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask about APH rules or missing info..."
                    className="flex-1 px-3 py-1.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-forest-600 focus:outline-none"
                  />
                  <button type="submit" className="px-3 py-1.5 bg-forest-600 text-white rounded-xl text-xs font-bold hover:bg-forest-700">
                    Send
                  </button>
                </form>
              </div>
            )}
          </div>

          {/* ---------------- MODAL 1: MANAGER DECISION MODAL ---------------- */}
          {selectedApp && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl border border-gray-100">
                <div className="flex justify-between items-center mb-4">
                  <div>
                    <h3 className="text-lg font-bold text-forest-600">Officer Adjudication Workbench</h3>
                    <p className="text-xs text-gray-400">Application #{selectedApp.application_number}</p>
                  </div>
                  <button onClick={() => setSelectedApp(null)} className="text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="p-3 bg-gray-50 rounded-xl">
                    <p className="font-bold text-gray-800">{selectedApp.applicant_name}</p>
                    <p className="text-gray-500 mt-0.5">Classification: {selectedApp.dossier_type}</p>
                    <p className="text-gray-500">Current Status: <span className="font-bold text-forest-600">{selectedApp.status}</span></p>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-forest-600 uppercase mb-1">Verification Directive / Remarks</label>
                    <textarea
                      rows="3"
                      placeholder="Enter official committee findings, compliance stipulations, or deficiency details..."
                      className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-forest-600 focus:outline-none"
                      value={managerRemarks}
                      onChange={(e) => setManagerRemarks(e.target.value)}
                    />
                  </div>

                  {decisionMsg && (
                    <div className="p-3 bg-emerald-50 text-emerald-800 font-bold rounded-xl text-center">
                      {decisionMsg}
                    </div>
                  )}

                  <div className="pt-4 border-t border-gray-100 grid grid-cols-3 gap-2">
                    <button
                      onClick={() => handleManagerDecision('VERIFIED')}
                      className="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm text-center"
                    >
                      ✓ Approve (Verify)
                    </button>
                    <button
                      onClick={() => handleManagerDecision('NEEDS_CORRECTION')}
                      className="py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-sm text-center"
                    >
                      ⚠ Request Correction
                    </button>
                    <button
                      onClick={() => handleManagerDecision('REJECTED')}
                      className="py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-sm text-center"
                    >
                      ✕ Reject Tampered
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ---------------- MODAL 2: PRINTABLE OFFICIAL AUDIT CERTIFICATE ---------------- */}
          {certificateData && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-8 shadow-2xl border border-gray-100 relative">
                <button
                  onClick={() => setCertificateData(null)}
                  className="absolute top-6 right-6 text-gray-400 hover:text-gray-600 text-2xl font-bold"
                >
                  ×
                </button>

                <div id="printable-certificate" className="border-4 border-double border-forest-600 p-8 rounded-2xl bg-white space-y-6">
                  {/* Certificate Header */}
                  <div className="text-center space-y-2 border-b border-gray-200 pb-6">
                    <div className="w-16 h-16 bg-forest-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-md">
                      <Icons.Shield />
                    </div>
                    <h2 className="text-2xl font-black text-forest-600 tracking-wide uppercase">Official Certificate of Document Verification</h2>
                    <p className="text-xs text-gray-500 font-semibold tracking-wider uppercase">Republic Regulatory Verification Commission • Document Integrity Division</p>
                    <p className="text-xs font-mono font-bold text-forest-700">Verification ID: {certificateData.verification_id}</p>
                  </div>

                  {/* Body Content */}
                  <div className="space-y-4 text-xs text-gray-700 leading-relaxed">
                    <p>
                      This document officially certifies that the archive titled <strong className="text-gray-900">{certificateData.document.original_name}</strong> has undergone automated cryptographic inspection, Error Level Analysis (ELA), and optical parameter validation in compliance with regulatory standards.
                    </p>

                    <div className="grid grid-cols-2 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                      <div>
                        <p className="text-[10px] text-gray-400 uppercase font-bold">Document Category</p>
                        <p className="font-bold text-gray-900">{certificateData.document.category}</p>
                      </div>
                      <div>
                        <p className="text-[10px] text-gray-400 uppercase font-bold">Authenticity Confidence</p>
                        <p className="font-bold text-forest-600 text-lg">{certificateData.document.authenticity_score}%</p>
                      </div>
                      <div className="col-span-2">
                        <p className="text-[10px] text-gray-400 uppercase font-bold">Cryptographic SHA-256 Digest</p>
                        <p className="font-mono text-[10px] text-gray-700 break-all">{certificateData.document.sha256_hash}</p>
                      </div>
                      <div className="col-span-2">
                        <p className="text-[10px] text-gray-400 uppercase font-bold">Blockchain Proof Hash (Block #{certificateData.block_height})</p>
                        <p className="font-mono text-[10px] text-forest-800 break-all">{certificateData.blockchain_hash}</p>
                      </div>
                    </div>

                    <div className="flex justify-between items-center p-3 rounded-xl border border-gray-200">
                      <span className="font-bold">Official Verification Verdict:</span>
                      <span className={`px-4 py-1 rounded-full text-xs font-black ${
                        certificateData.document.verdict === 'REAL' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                      }`}>
                        {certificateData.document.verdict === 'REAL' ? 'AUTHENTIC / APPROVED' : 'TAMPERED / REJECTED'}
                      </span>
                    </div>
                  </div>

                  {/* Sign-off Footer */}
                  <div className="border-t border-gray-200 pt-6 flex justify-between items-end">
                    <div>
                      <p className="text-[10px] text-gray-400 uppercase font-bold">Authorized Officer</p>
                      <p className="text-xs font-bold text-forest-900 mt-1">{certificateData.authorized_officer}</p>
                      <p className="text-[10px] text-gray-400">{certificateData.issued_at}</p>
                    </div>
                    <div className="text-right">
                      <div className="w-20 h-20 border-2 border-forest-600 rounded-xl flex flex-col items-center justify-center font-mono text-[8px] text-forest-600 p-1 bg-forest-50/50">
                        <span className="font-bold">[QR VALID]</span>
                        <span className="text-[7px] text-gray-500 mt-1">SCAN TO VERIFY</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex justify-end space-x-3">
                  <button
                    onClick={() => window.print()}
                    className="px-4 py-2 bg-forest-600 hover:bg-forest-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center space-x-1.5"
                  >
                    <Icons.Printer />
                    <span>Print Official Certificate</span>
                  </button>
                  <button
                    onClick={() => setCertificateData(null)}
                    className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ---------------- MODAL 3: START ARCHIVE VAULT INGESTION ---------------- */}
          {showStartVaultModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gray-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-forest-600">Start Evidence Archive Vault Ingestion</h3>
                  <button onClick={() => setShowStartVaultModal(false)} className="text-gray-400 hover:text-gray-600 text-xl font-bold">×</button>
                </div>
                <p className="text-xs text-gray-500 mb-6">Instantly index and store a compliance record in the cryptographic vault.</p>
                <form onSubmit={(e) => { e.preventDefault(); setShowStartVaultModal(false); setActiveTab('ai-verify'); }} className="space-y-4">
                  <div>
                    <label className="block text-[11px] font-bold text-forest-600 uppercase mb-1">Archive Classification</label>
                    <select className="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-xs bg-white">
                      <option>Land Registry & Infrastructure Deed</option>
                      <option>Regulatory Compliance Certificate (APH)</option>
                      <option>Financial Audit Statement</option>
                      <option>Accreditation & Faculty Credentials</option>
                      <option>Identity Document & Passport</option>
                    </select>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white font-bold rounded-xl text-xs uppercase"
                  >
                    Proceed to Document Upload
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ---------------- MODAL 4: TECH ARCHITECTURE & WORKFLOW ---------------- */}
          {showTechModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-3xl w-full p-8 shadow-2xl border border-gray-100 max-h-[90vh] overflow-y-auto custom-scroll">
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h3 className="text-xl font-black text-forest-600">System Architecture & Verification Workflow</h3>
                    <p className="text-xs text-gray-400">End-to-End Hand-off Protocol based on APH 2026-27 Specifications</p>
                  </div>
                  <button onClick={() => setShowTechModal(false)} className="text-gray-400 hover:text-gray-600 text-2xl font-bold">×</button>
                </div>

                <div className="space-y-6 text-xs text-gray-700">
                  {/* 8-Step Pipeline */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {[
                      { step: '1. Application Upload', desc: 'User submits application and supporting documents (PDFs, scans, structural drawings).' },
                      { step: '2. OCR / Text Extraction', desc: 'Extracts text and key parameters using Tesseract OCR, OpenCV, and LayoutLMv3.' },
                      { step: '3. Application Validation', desc: 'Checks missing fields, incorrect formats, and cross-field information mismatches.' },
                      { step: '4. Document Authentication', desc: 'Error Level Analysis (ELA), digital signatures, and DigiLocker authorized verification.' },
                      { step: '5. Regulatory Compliance Rules', desc: 'Checks applicable APH regulations, required certificates, and validity dates.' },
                      { step: '6. AI Risk Assessment', desc: 'Identifies suspicious patterns, assigns risk score (0-100%), and categorizes risk level.' },
                      { step: '7. Low Risk & Manual Review', desc: 'Low-risk items proceed automatically; suspicious cases route to appointed officers.' },
                      { step: '8. Report & Secure Audit', desc: 'Generates verification report, tamper notices, and immutable AES audit records.' }
                    ].map((s, idx) => (
                      <div key={idx} className="p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <p className="font-bold text-forest-700">{s.step}</p>
                        <p className="text-[11px] text-gray-600 mt-0.5">{s.desc}</p>
                      </div>
                    ))}
                  </div>

                  {/* Technology Stack Grid */}
                  <div className="border-t border-gray-200 pt-4">
                    <h4 className="font-bold text-sm text-forest-800 mb-3">Key Software & Technologies Implemented</h4>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                      <div className="p-3 bg-forest-50 rounded-xl border border-forest-200">
                        <p className="text-[10px] font-bold text-gray-400 uppercase">Frontend & 3D</p>
                        <p className="font-bold text-forest-800 text-xs mt-1">React 18 + Three.js</p>
                        <p className="text-[10px] text-gray-500">Tailwind CSS, WebGL 3D</p>
                      </div>
                      <div className="p-3 bg-forest-50 rounded-xl border border-forest-200">
                        <p className="text-[10px] font-bold text-gray-400 uppercase">Backend</p>
                        <p className="font-bold text-forest-800 text-xs mt-1">Python Full-Stack</p>
                        <p className="text-[10px] text-gray-500">FastAPI/Flask + Redis Queue</p>
                      </div>
                      <div className="p-3 bg-forest-50 rounded-xl border border-forest-200">
                        <p className="text-[10px] font-bold text-gray-400 uppercase">AI / ML & Biometrics</p>
                        <p className="font-bold text-forest-800 text-xs mt-1">PyTorch + OpenCV</p>
                        <p className="text-[10px] text-gray-500">ArcFace Liveness + ELA</p>
                      </div>
                      <div className="p-3 bg-forest-50 rounded-xl border border-forest-200">
                        <p className="text-[10px] font-bold text-gray-400 uppercase">Security & DB</p>
                        <p className="font-bold text-forest-800 text-xs mt-1">Blockchain + OAuth2</p>
                        <p className="text-[10px] text-gray-500">PostgreSQL, DigiLocker API</p>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex justify-end">
                  <button
                    onClick={() => setShowTechModal(false)}
                    className="px-4 py-2 bg-forest-600 hover:bg-forest-700 text-white font-bold text-xs rounded-xl"
                  >
                    Close Architecture
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
