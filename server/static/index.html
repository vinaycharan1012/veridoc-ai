<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b4332">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VERIDOC">
  
  <title>VERIDOC वेरीडॉक — Regulatory Verification & Audit Operations Platform</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js for 3D Holographic Visuals -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- React 18 & ReactDOM (High-Reliability CDN with Fallback) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
    if (!window.ReactDOM) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            forest: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#2d6a4f',
              600: '#1b4332', /* Primary Forest Green */
              700: '#143628',
              800: '#0e261d',
              900: '#06140e',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 4s ease-in-out infinite',
            'spin-slow': 'spin 3s linear infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #ffffff;
      color: #111827;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #1b4332;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f9fafb;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 9999px;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-certificate, #printable-certificate * {
        visibility: visible;
      }
      #printable-certificate {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
      }
    }
    /* Fallback Splash Animation */
    .loader-ring {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid #dcfce7;
      border-top-color: #1b4332;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-white antialiased selection:bg-forest-100 selection:text-forest-900">
  
  <!-- App Root with Instant High-Performance Fallback -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; padding: 24px; text-align: center;">
      <div style="width: 72px; height: 72px; background: #1b4332; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(27, 67, 50, 0.3); margin-bottom: 24px;">
        <svg style="width: 38px; height: 38px; color: #ffffff;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <div style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: #1b4332; margin-bottom: 4px;">
        VERIDOC <span style="font-size: 16px; font-weight: 700; color: #52b788; margin-left: 6px;">• वेरीडॉक</span>
      </div>
      <p style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #6b7280; margin-bottom: 24px; max-width: 380px;">
        Regulatory Verification & Audit Operations Platform
      </p>
      <div class="loader-ring" style="margin-bottom: 16px;"></div>
      <p style="font-size: 13px; font-weight: 500; color: #374151;">
        Initializing Cryptographic Engine & AI Models...
      </p>
      <noscript>
        <p style="color: #dc2626; margin-top: 16px; font-weight: bold;">
          JavaScript is required to operate the VERIDOC regulatory compliance portal. Please enable JavaScript in your browser settings.
        </p>
      </noscript>
    </div>
  </div>

  <!-- Precompiled Pure Production JavaScript (Zero In-Browser Babel Lag, Instant Load) -->
  <script src="/static/app.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('VERIDOC ServiceWorker registered successfully:', reg.scope);
        }).catch((err) => {
          console.log('ServiceWorker registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
